    <mask id="bars">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
        <rect x="252" y="422" width="40" height="110" rx="20"/><rect x="316" y="372" width="40" height="210" rx="20"/>
        <rect x="380" y="402" width="40" height="150" rx="20"/><rect x="444" y="342" width="40" height="270" rx="20"/>
      </g>
      <g fill="#808080">
        <rect x="540" y="342" width="40" height="270" rx="20"/><rect x="604" y="402" width="40" height="150" rx="20"/>
        <rect x="668" y="372" width="40" height="210" rx="20"/><rect x="732" y="422" width="40" height="110" rx="20"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(512 512) scale(0.66) translate(-512 -546)">
